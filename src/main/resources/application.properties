spring.application.name=anurag-university-bus-tracking
server.port=${PORT:8081}

# PostgreSQL (default profile)
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-db33gnugekts739bsm90-a/anurag_university_bus_tracking}
spring.datasource.username=${DB_USERNAME:anurag_university_bus_tracking_user}
spring.datasource.password=${DB_PASSWORD:ZjFVWjj7pkPryXEXJ6sxVGysv14IaBFt}
