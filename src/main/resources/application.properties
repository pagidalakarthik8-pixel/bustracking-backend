# ---------- BusTrack backend configuration ----------
# All values can be overridden with environment variables (used for cloud deployment).

server.port=${PORT:8080}

# MySQL (default profile)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bustrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Karthik@1.}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
bustrack.jwt.secret=${JWT_SECRET:bustrack-dev-secret-change-me-bustrack-dev-secret-change-me}
bustrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma separated list of allowed frontend origins (CORS)
bustrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Seed demo data (admin + sample buses/routes) on first start
bustrack.seed.enabled=${SEED_ENABLED:true}
bustrack.seed.admin-email=${ADMIN_EMAIL:admin@bustrack.com}
bustrack.seed.admin-password=${ADMIN_PASSWORD:admin123}
